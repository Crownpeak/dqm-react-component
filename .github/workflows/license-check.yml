name: License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  npm-license-check:
    name: NPM License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check licenses (root)
        run: npx license-checker --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;BlueOak-1.0.0;Zlib;WTFPL' --production

      - name: Check licenses (mcp-server)
        run: npx license-checker --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;BlueOak-1.0.0;Zlib;WTFPL' --production --start ./mcp-server

  generate-license-report:
    name: Generate License Report
    runs-on: ubuntu-latest
    needs: [npm-license-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate npm license file
        run: npx generate-license-file --config .glfrc.json

      - name: Upload license artifacts
        uses: actions/upload-artifact@v4
        with:
          name: license-files
          path: THIRD_PARTY_LICENSES.txt
          retention-days: 30
