name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install dependencies
      run: npm i

    - name: Builds Wiki
      run: npm run wiki:build
    
    # Testing
    - name: Publish Wiki
      uses: Andrew-Chen-Wang/github-wiki-action@v4
      with:
        commit-message: "Update wiki for version ${{ github.event.release.tag_name }}"
        path: ./wiki
        strategy: init

    - uses: actions/checkout@v4
      name: Checkout Probe CLI Repository
      with:
        repository: probelabs/probe
        ref: refs/tags/v0.6.0-rc178
        token: ${{ secrets.CLONE_TOKEN }}
        path: probe

    - name: Build Probe CLI
      working-directory: ./probe
      run: cargo build --release

    - name: Add Probe CLI to PATH
      run: cargo install --path ./probe

    - name: Run Tests
      run: npm test
    
    - name: Lint
      run: npm run lint || true
    
    - name: Build library
      run: npm run build:lib
    
    - name: Build server
      run: npm run build:server
    
    - name: Build auth-ui
      run: npm run build:auth-ui

    - name: Build widget
      run: npm run build:widget
    
    - name: Check bundle size
      run: npm pack --dry-run

    - name: Build MCP Server
      working-directory: ./mcp-server
      run: npm run build

    - name: Check MCP Bundle Size
      working-directory: ./mcp-server
      run: npm pack --dry-run
